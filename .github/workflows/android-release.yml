name: Android AAR

on:
  push:
    branches: [main]
    tags: ['android-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Install NDK and cargo-ndk
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;35.0.0'
          cargo install cargo-ndk --locked
      - name: Build native libraries
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86 -t x86_64 -o bindings/android/ironpress-android/src/main/jniLibs build -p ironpress-android --release
      - name: Keep only the JNI library in the AAR
        shell: bash
        run: |
          NDK_STRIP="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          while IFS= read -r library; do
            "$NDK_STRIP" --strip-unneeded "$library"
          done < <(find bindings/android/ironpress-android/src/main/jniLibs -name 'libironpress_android.so' -type f)
          find bindings/android/ironpress-android/src/main/jniLibs -type f -name '*.so' ! -name 'libironpress_android.so' -delete
      - name: Build AAR
        working-directory: bindings/android
        run: gradle --no-daemon :ironpress-android:assembleRelease
      - name: Package release
        run: |
          mkdir -p dist
          cp bindings/android/ironpress-android/build/outputs/aar/ironpress-android-release.aar dist/ironpress-android.aar
          cd dist
          sha256sum ironpress-android.aar > ironpress-android.aar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ironpress-android-aar
          path: dist/ironpress-android.aar*
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/ironpress-android.aar dist/ironpress-android.aar.sha256 --repo "${GITHUB_REPOSITORY}" --generate-notes
